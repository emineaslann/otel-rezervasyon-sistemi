spring.application.name=backend
server.port=8080

# ---------------------------------------------------------------
# Veritabanı bağlantısı
# Şifre bu dosyada değil, application-local.properties içinde
# ---------------------------------------------------------------
spring.datasource.url=jdbc:mysql://localhost:3306/otel_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Europe/Istanbul&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=
spring.config.import=optional:classpath:application-local.properties

# ---------------------------------------------------------------
# JPA / Hibernate
# Tabloları SQL betikleri oluşturur; Hibernate şemaya DOKUNMAZ
# ---------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
# Tablo ve sütun adlarını olduğu gibi kullan (OdaTipi -> oda_tipi YAPMA)
spring.jpa.hibernate.naming.physical-strategy=com.otel.backend.config.BirebirIsimStratejisi
# ---------------------------------------------------------------
# JWT
# Gizli anahtar en az 32 karakter olmalı. Bu değer geliştirme içindir;
# kendi anahtarınızı application-local.properties içine yazarak değiştirebilirsiniz.
# ---------------------------------------------------------------
app.jwt.gizli-anahtar=otel-rezervasyon-sistemi-gelistirme-anahtari-0123456789-abcdefgh
app.jwt.gecerlilik-saat=8